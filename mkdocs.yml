docs_dir: docs
site_dir: site
use_directory_urls: true

# MkDocs excludes a top-level templates/ directory by default (it assumes theme
# templates). Here it holds playbook content, so it is re-included explicitly.
exclude_docs: |
  !templates/

theme:
  name: material
  language: en
  custom_dir: src/overrides
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.footer
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.path
    - toc.follow
    - content.tabs.link
    - content.code.copy
    - footer.social
  logo: assets/logo.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: deep purple
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: deep purple
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  font:
    text: "Roboto"
    code: "Roboto Mono"
  favicon: assets/favicon.png
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.magiclink
  - pymdownx.mark
  - pymdownx.progressbar
  - pymdownx.saneheaders
  - pymdownx.smartsymbols
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - meta

plugins:
  - search:
      separator: '[\s\-\.]+'
      lang: en
  - social:
      cards_layout_options:
        background_color: "#673ab7"
        color: "#ffffff"
  - minify:
      minify_html: true

extra_javascript:
  - https://unpkg.com/mermaid@10/dist/mermaid.min.js

extra:
  social:
    - icon: material/web
      link: https://dreamingecho.es
      name: Website
    - icon: fontawesome/brands/github
      link: https://github.com/dreamingechoes
      name: GitHub
    - icon: fontawesome/brands/bluesky
      link: https://bsky.app/profile/dreamingechoes.bsky.social
      name: Bluesky
    - icon: fontawesome/brands/linkedin
      link: https://linkedin.com/in/ivan-gonzalez-saiz
      name: LinkedIn
  generator: false

