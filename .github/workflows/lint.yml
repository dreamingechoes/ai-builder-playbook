name: Lint

on:
  pull_request:
    paths:
      - "**/*.md"
      - ".markdownlint.*"
      - ".prettierrc"
      - "package.json"
  push:
    branches: [main]
    paths:
      - "**/*.md"
      - ".markdownlint.*"
      - ".prettierrc"
      - "package.json"

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint Markdown & Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run markdownlint
        run: npm run lint:md

      - name: Check formatting
        run: npm run lint:format
